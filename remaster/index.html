<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: ws://localhost:* ws://127.0.0.1:*; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Marbylon Madness 3D — A 3D Homage to Marble Madness (1984)</title>
    <link rel="icon" href="data:," />
    <script type="module" crossorigin src="./assets/remaster-C4AF_a0T.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/engineStore-Bn2tApal.js">
    <link rel="modulepreload" crossorigin href="./assets/logger-CuBYPcDK.js">
    <link rel="modulepreload" crossorigin href="./assets/shaderStore-D-XQlhUT.js">
    <link rel="modulepreload" crossorigin href="./assets/precisionDate-DgO8bWsc.js">
    <link rel="modulepreload" crossorigin href="./assets/performanceConfigurator-UtxC_Odd.js">
    <link rel="modulepreload" crossorigin href="./assets/internalTexture-B3djGrls.js">
    <link rel="modulepreload" crossorigin href="./assets/thinEngine.pure-C-ezXnsA.js">
    <link rel="modulepreload" crossorigin href="./assets/math.scalar.functions-Bcxiuh2E.js">
    <link rel="modulepreload" crossorigin href="./assets/halfFloat-Cfx5m4ll.js">
    <link rel="modulepreload" crossorigin href="./assets/math.color.pure-DLMyD1Sf.js">
    <link rel="stylesheet" crossorigin href="./assets/remaster-ipU4W3CH.css">
  </head>
  <body>
    <main id="remaster-stage">
      <canvas id="remaster-canvas" aria-label="Marbylon Madness 3D"></canvas>
      <div id="scanlines-overlay" aria-hidden="true"></div>

      <header id="remaster-hud">
        <div class="hud-block">
          <span class="hud-label">SCORE P1</span>
          <strong id="hud-score">0</strong>
        </div>
        <div class="hud-block" id="hud-p2-block" hidden>
          <span class="hud-label">SCORE P2</span>
          <strong id="hud-score-p2">0</strong>
        </div>
        <div class="hud-block hud-center">
          <span class="hud-label">TIME</span>
          <strong id="hud-timer">60</strong>
        </div>
        <div class="hud-block hud-right">
          <span class="hud-label" id="hud-level-label"
            >COURSE 1 · PRACTICE</span
          >
          <strong id="hud-status">ATTRACT</strong>
        </div>
      </header>

      <section id="remaster-banner" aria-live="polite" hidden>
        <h1 id="banner-title">PRACTICE RACE</h1>
        <p id="banner-sub">Press Space or Click to play</p>
      </section>

      <footer id="remaster-toolbar">
        <div class="toolbar-group">
          <button id="btn-attract" type="button" title="Return to Title 3D (Q)">
            Title (Q)
          </button>
          <label class="control-select">
            Course
            <select id="level-select" aria-label="Select course">
              <option value="1" selected>1 · Practice</option>
              <option value="2">2 · Beginner</option>
              <option value="3">3 · Intermediate</option>
              <option value="4">4 · Aerial</option>
              <option value="5">5 · Silly</option>
              <option value="6">6 · Ultimate</option>
            </select>
          </label>
          <button id="btn-camera" type="button">Camera: Arcade (C)</button>
          <button id="btn-players" type="button">Mode: 1P</button>
          <label class="control-select">
            P1
            <select id="p1-control" aria-label="Player 1 control">
              <option value="trackpad" selected>Trackpad / Mouse</option>
              <option value="keyboard">Keyboard (Arrows + WASD/ZQSD)</option>
              <option value="arrows">Keyboard (Arrows)</option>
              <option value="wasd">Keyboard (WASD / ZQSD)</option>
              <option value="gamepad1">Gamepad 1</option>
              <option value="gamepad2">Gamepad 2</option>
            </select>
          </label>
          <label class="control-select" id="p2-control-wrap" hidden>
            P2
            <select id="p2-control" aria-label="Player 2 control">
              <option value="keyboard" selected>
                Keyboard (Arrows + WASD/ZQSD)
              </option>
              <option value="wasd">Keyboard (WASD / ZQSD)</option>
              <option value="arrows">Keyboard (Arrows)</option>
              <option value="trackpad">Trackpad / Mouse</option>
              <option value="gamepad1">Gamepad 1</option>
              <option value="gamepad2">Gamepad 2</option>
            </select>
          </label>
          <button id="btn-timer" type="button">Timer: Regular (T)</button>
          <button id="btn-scanlines" type="button">Scanlines: ON (S)</button>
          <button id="btn-reset" type="button">Restart (R)</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-audio" type="button">Audio: ON (M)</button>
          <label class="mix-slider">
            Music
            <input
              id="mix-music"
              type="range"
              min="0"
              max="100"
              value="75"
              aria-label="Music volume"
            />
          </label>
          <label class="mix-slider">
            SFX
            <input
              id="mix-sfx"
              type="range"
              min="0"
              max="100"
              value="100"
              aria-label="SFX volume"
            />
          </label>
          <label class="mix-slider">
            Ball Sensitivity
            <input
              id="agility-slider"
              type="range"
              min="25"
              max="200"
              step="5"
              value="80"
              aria-label="Ball sensitivity"
            />
            <span id="agility-val">0.80×</span>
          </label>
          <label class="file-btn">
            Load .VGM/.VGZ
            <input id="vgm-file" type="file" accept=".vgm,.vgz" hidden />
          </label>
          <span id="telemetry" class="telemetry">0.0 c/s</span>
        </div>
      </footer>
    </main>
  </body>
</html>
