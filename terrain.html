<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Madness — 3D Terrain Study</title>
  </head>
  <body>
    <main>
      <div class="terrain-stage">
        <div id="terrain-png-pane" hidden>
          <canvas
            id="terrain-png-side"
            width="336"
            height="240"
            aria-label="Original arcade PNG level view"
          ></canvas>
        </div>
        <div class="terrain-3d-pane">
          <canvas id="game" aria-label="Marble Madness 3D terrain"></canvas>
          <img id="terrain-reference" alt="Arcade screenshot" hidden />
          <canvas
            id="terrain-png-overlay"
            width="336"
            height="240"
            aria-hidden="true"
            hidden
          ></canvas>
        </div>
      </div>
      <details class="terrain-controls" open>
        <summary>3D Study Tools</summary>
        <label for="terrain-file">Load terrain survey</label>
        <input id="terrain-file" type="file" accept=".json,application/json" />
        <button id="terrain-play" type="button" hidden>
          Play Level 2 · F2
        </button>
        <button id="terrain-load-level1" type="button" hidden>
          Level 1 · Practice
        </button>
        <button id="terrain-load-level2" type="button" hidden>
          Level 2 · Beginner
        </button>
        <button id="terrain-load-level3" type="button" hidden>
          Level 3 · Intermediate
        </button>
        <button id="terrain-load-level4" type="button" hidden>
          Level 4 · Aerial
        </button>
        <button id="terrain-load-level5" type="button" hidden>
          Level 5 · Silly
        </button>
        <button id="terrain-load-level6" type="button" hidden>
          Level 6 · Ultimate
        </button>
        <p id="terrain-status" role="status">Test geometry</p>
        <label for="terrain-camera">Camera</label>
        <select id="terrain-camera" disabled>
          <option value="orbit">Free orbit</option>
          <option value="top">Top-down</option>
          <option value="arcade">Arcade framing</option>
          <option value="bridge" hidden disabled>Articulated bridge</option>
          <option value="pipes" hidden disabled>Pipes &amp; ramps</option>
          <option value="ice" hidden disabled>Ice &amp; finish</option>
        </select>
        <label for="terrain-compare-mode">Original PNG comparison</label>
        <select id="terrain-compare-mode" disabled>
          <option value="single">3D only</option>
          <option value="split">Side-by-side (PNG + 3D)</option>
          <option value="overlay">Overlay (PNG on 3D)</option>
        </select>
        <div id="terrain-png-align" hidden>
          <label for="terrain-png-offset-y">PNG Offset Y</label>
          <input
            id="terrain-png-offset-y"
            type="range"
            min="-200"
            max="200"
            value="0"
          />
          <label for="terrain-png-offset-x">PNG Offset X</label>
          <input
            id="terrain-png-offset-x"
            type="range"
            min="-140"
            max="140"
            value="0"
          />
        </div>
        <div id="terrain-l6-phase-control" hidden>
          <label for="terrain-l6-phase">Level 6 maze phase</label>
          <select id="terrain-l6-phase">
            <option value="auto">Auto (41f cycle)</option>
            <option value="0">Phase 0 (0x24e2a)</option>
            <option value="1">Phase 1 (0x24e32)</option>
            <option value="2">Phase 2 (0x24e3a)</option>
            <option value="3">Phase 3 (0x24e42)</option>
          </select>
        </div>
        <div id="terrain-scroll-control" hidden>
          <label for="terrain-scroll">Arcade scroll</label>
          <input id="terrain-scroll" type="range" value="0" />
          <output id="terrain-scroll-value" for="terrain-scroll">0 px</output>
        </div>
        <label for="terrain-reference-file">Arcade capture (optional)</label>
        <input
          id="terrain-reference-file"
          type="file"
          accept="image/png"
          disabled
        />
        <label for="terrain-opacity">PNG / capture opacity</label>
        <input
          id="terrain-opacity"
          type="range"
          min="0"
          max="100"
          value="50"
          disabled
        />
        <p id="reference-status" role="status"></p>
        <p id="terrain-orbit-help">
          Drag: rotate · Right-drag / Ctrl+drag or Arrows / WASD: pan · Wheel:
          zoom
        </p>
      </details>
    </main>
    <iframe
      id="terrain-player"
      title="Play Intermediate Race"
      allow="fullscreen"
      hidden
    ></iframe>
    <a id="terrain-return" href="./terrain.html" hidden>Back to study</a>
    <script type="module" src="/src/terrain.ts"></script>
  </body>
</html>
